services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true

  Pumukit\OaiBundle\Controller\:
    resource: '../../Controller'
    tags: ['controller.service_arguments']
    bind:
      $enabled: '%pumukitoai.enable%'

  Pumukit\OaiBundle\Services\OaiConfiguration:
    arguments:
      $listOnlyPublishedObjects: '%pumukitoai.list_only_published_objects%'
      $pubChannelTag: '%pumukitoai.pub_channel_tag%'
      $displayTrackTag: '%pumukitoai.display_track_tag%'
      $pageSize: '%pumukitoai.page_size%'
      $useDcThumbnail: '%pumukitoai.use_dc_thumbnail%'
      $videoDcType: '%pumukitoai.video_dc_type%'
      $audioDcType: '%pumukitoai.audio_dc_type%'
      $docDcType: '%pumukitoai.doc_dc_type%'
      $imageDcType: '%pumukitoai.image_dc_type%'
      $roleForDcCreator: '%pumukitoai.role_for_dc_creator%'
      $useLicenseAsDcRights: '%pumukitoai.use_license_as_dc_rights%'
      $useCopyrightAsDcPublisher: '%pumukitoai.use_copyright_as_dc_publisher%'
      $dcSubjectFormat: '%pumukitoai.dc_subject_format%'
      $dcIdentifierUrlMapping: '%pumukitoai.dc_identifier_url_mapping%'
      $locale: '%kernel.default_locale%'
      $pumukitInfo: '%pumukit.info%'

  Pumukit\OaiBundle\Services\RecordRepository: ~

  Pumukit\OaiBundle\Services\RecordWriter: ~

  Pumukit\OaiBundle\Services\OaiService: ~
